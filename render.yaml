services:
  # 1. FastAPI Machine Learning Backend
  - type: web
    name: cardio-risk-api
    runtime: python
    rootDir: backend
    buildCommand: npm --prefix ../cardio-frontend install && npm --prefix ../cardio-frontend run build && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. React + Vite Frontend
  - type: web
    name: cardio-risk-frontend
    runtime: static
    rootDir: cardio-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cardio-risk-api-rija.onrender.com
